name: Apply and verify issue 13 fix

on:
  push:
    branches: [fix/issue-13-compaction-callback-lock]
  pull_request:
    branches: [fix/issue-10-deep-clone-history]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-13.py
      - run: rm -f .github/fixes/issue-13.py .github/workflows/apply-issue-13.yml
      - run: gofmt -w sdk/agent/agent.go sdk/agent/agent_compaction_callback_lock_test.go
      - run: git diff --check
      - name: Targeted tests
        run: go test ./sdk/agent -run 'TestApplyPendingCompactionWriterCanReadMessages|TestBlockedCheckpointWriterDoesNotBlockHistoryReads' -count=1
      - name: Race-focused tests
        run: go test -race ./sdk/agent -run 'TestApplyPendingCompactionWriterCanReadMessages|TestBlockedCheckpointWriterDoesNotBlockHistoryReads' -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): persist compaction checkpoints outside history lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
