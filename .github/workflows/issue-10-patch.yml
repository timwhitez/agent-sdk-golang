name: Apply issue 10 fix

on:
  push:
    branches:
      - fix/issue-10-history-clones
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"

      - name: Add deep-clone boundaries for history
        working-directory: repo
        run: |
          set -euo pipefail
          cat > sdk/llm/clone.go <<'EOF'
          package llm

          // CloneContent returns a deep copy of content and every mutable nested
          // value. Strings are immutable values; pointer-backed blocks are copied
          // so callers cannot mutate a retained conversation through aliases.
          func CloneContent(content Content) Content {
           out := content
           if content.Blocks != nil {
            out.Blocks = make([]ContentBlock, len(content.Blocks))
            for i, block := range content.Blocks {
             out.Blocks[i] = block
             if block.ImageURL != nil {
              image := *block.ImageURL
              out.Blocks[i].ImageURL = &image
             }
             if block.Source != nil {
              source := *block.Source
              out.Blocks[i].Source = &source
             }
            }
           }
           return out
          }

          // CloneToolCalls returns a deep copy of tool calls, including opaque
          // provider signatures that are stored as mutable byte slices.
          func CloneToolCalls(calls []ToolCall) []ToolCall {
           if calls == nil {
            return nil
           }
           out := make([]ToolCall, len(calls))
           copy(out, calls)
           for i := range calls {
            if calls[i].ThoughtSig != nil {
             out[i].ThoughtSig = append([]byte{}, calls[i].ThoughtSig...)
            }
           }
           return out
          }

          // CloneMessage returns a deep copy suitable for crossing an ownership
          // boundary between an Agent and its caller.
          func CloneMessage(message Message) Message {
           out := message
           out.Content = CloneContent(message.Content)
           out.ToolCalls = CloneToolCalls(message.ToolCalls)
           return out
          }

          // CloneMessages preserves nil-versus-empty slice semantics while
          // returning messages with no mutable aliases to the input.
          func CloneMessages(messages []Message) []Message {
           if messages == nil {
            return nil
           }
           out := make([]Message, len(messages))
           for i, message := range messages {
            out[i] = CloneMessage(message)
           }
           return out
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdk/agent/agent.go")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''\tif len(cfg.InitialMessages) > 0 {\n\t\tag.messages = append([]llm.Message(nil), cfg.InitialMessages...)\n\t}\n''',
                  '''\tif len(cfg.InitialMessages) > 0 {\n\t\tag.messages = llm.CloneMessages(cfg.InitialMessages)\n\t}\n''',
                  "InitialMessages",
              ),
              (
                  '''func (a *Agent) Messages() []llm.Message {\n\ta.mu.Lock()\n\tdefer a.mu.Unlock()\n\tcpy := make([]llm.Message, len(a.messages))\n\tcopy(cpy, a.messages)\n\treturn cpy\n}\n''',
                  '''func (a *Agent) Messages() []llm.Message {\n\ta.mu.Lock()\n\tdefer a.mu.Unlock()\n\treturn llm.CloneMessages(a.messages)\n}\n''',
                  "Messages",
              ),
              (
                  '''func (a *Agent) ReplaceHistory(messages []llm.Message) {\n\ta.mu.Lock()\n\ta.messages = append([]llm.Message(nil), messages...)\n\ta.resetEphemeralTrackingLocked()\n''',
                  '''func (a *Agent) ReplaceHistory(messages []llm.Message) {\n\ta.mu.Lock()\n\ta.messages = llm.CloneMessages(messages)\n\ta.resetEphemeralTrackingLocked()\n''',
                  "ReplaceHistory",
              ),
              (
                  '''\tout := make(chan Event, bufferSize)\n\tunregisterTurn := a.registerTurnCancellation(out, ctx)\n\tgo func() {\n''',
                  '''\tout := make(chan Event, bufferSize)\n\tinput = llm.CloneContent(input)\n\tunregisterTurn := a.registerTurnCancellation(out, ctx)\n\tgo func() {\n''',
                  "QueryStream input",
              ),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected agent.go shape for {label}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

          cat > sdk/llm/clone_test.go <<'EOF'
          package llm

          import "testing"

          func TestCloneMessagesDeepCopiesMutableNestedValues(t *testing.T) {
           original := []Message{
            {
             Role: RoleUser,
             Content: Content{Blocks: []ContentBlock{
              {
               Type:     "image_url",
               Text:     "original text",
               ImageURL: &ImageURL{URL: "https://example.test/original.png", Detail: "high"},
               Source:   &DocSrc{Data: "ZG9j", MediaType: "application/pdf"},
              },
             }},
            },
            {
             Role: RoleAssistant,
             ToolCalls: []ToolCall{
              {
               ID:         "call-1",
               Type:       "function",
               Function:   FunctionCall{Name: "read", Arguments: `{"path":"a"}`},
               ThoughtSig: []byte{1, 2, 3},
              },
             },
            },
           }

           cloned := CloneMessages(original)
           cloned[0].Content.Blocks[0].Text = "clone text"
           cloned[0].Content.Blocks[0].ImageURL.URL = "https://example.test/clone.png"
           cloned[0].Content.Blocks[0].Source.Data = "Y2xvbmU="
           cloned[1].ToolCalls[0].ThoughtSig[0] = 9

           if got := original[0].Content.Blocks[0].Text; got != "original text" {
            t.Fatalf("original text mutated through clone: %q", got)
           }
           if got := original[0].Content.Blocks[0].ImageURL.URL; got != "https://example.test/original.png" {
            t.Fatalf("original image URL mutated through clone: %q", got)
           }
           if got := original[0].Content.Blocks[0].Source.Data; got != "ZG9j" {
            t.Fatalf("original document source mutated through clone: %q", got)
           }
           if got := original[1].ToolCalls[0].ThoughtSig[0]; got != 1 {
            t.Fatalf("original thought signature mutated through clone: %d", got)
           }

           original[0].Content.Blocks[0].ImageURL.Detail = "low"
           original[1].ToolCalls[0].ThoughtSig[1] = 8
           if got := cloned[0].Content.Blocks[0].ImageURL.Detail; got != "high" {
            t.Fatalf("clone image detail mutated through original: %q", got)
           }
           if got := cloned[1].ToolCalls[0].ThoughtSig[1]; got != 2 {
            t.Fatalf("clone thought signature mutated through original: %d", got)
           }
          }

          func TestCloneMessagesPreservesNilAndEmptySlices(t *testing.T) {
           if CloneMessages(nil) != nil {
            t.Fatal("nil message slice must remain nil")
           }
           empty := CloneMessages([]Message{})
           if empty == nil || len(empty) != 0 {
            t.Fatalf("non-nil empty slice changed: %#v", empty)
           }
          }
          EOF

          cat > sdk/agent/agent_history_clone_test.go <<'EOF'
          package agent

          import (
           "context"
           "testing"

           "github.com/timwhitez/agent-sdk-golang/sdk/llm"
          )

          type historyCloneModel struct{}

          func (historyCloneModel) Provider() string { return "stub" }
          func (historyCloneModel) Model() string    { return "stub" }
          func (historyCloneModel) Invoke(context.Context, llm.InvokeRequest) (*llm.Completion, error) {
           return &llm.Completion{Content: llm.TextContent("ok")}, nil
          }

          func cloneHistoryFixture() []llm.Message {
           return []llm.Message{
            {
             Role: llm.RoleUser,
             Content: llm.Content{Blocks: []llm.ContentBlock{
              {
               Type:     "image_url",
               Text:     "seed",
               ImageURL: &llm.ImageURL{URL: "https://example.test/seed.png"},
               Source:   &llm.DocSrc{Data: "c2VlZA==", MediaType: "application/pdf"},
              },
             }},
            },
            {
             Role: llm.RoleAssistant,
             ToolCalls: []llm.ToolCall{
              {ID: "call-1", Type: "function", ThoughtSig: []byte{1, 2, 3}},
             },
            },
           }
          }

          func assertHistoryFixtureUnchanged(t *testing.T, got []llm.Message) {
           t.Helper()
           if text := got[0].Content.Blocks[0].Text; text != "seed" {
            t.Fatalf("history text = %q, want seed", text)
           }
           if url := got[0].Content.Blocks[0].ImageURL.URL; url != "https://example.test/seed.png" {
            t.Fatalf("history image URL = %q", url)
           }
           if data := got[0].Content.Blocks[0].Source.Data; data != "c2VlZA==" {
            t.Fatalf("history document data = %q", data)
           }
           if sig := got[1].ToolCalls[0].ThoughtSig[0]; sig != 1 {
            t.Fatalf("history thought signature[0] = %d, want 1", sig)
           }
          }

          func mutateHistoryFixture(messages []llm.Message) {
           messages[0].Content.Blocks[0].Text = "mutated"
           messages[0].Content.Blocks[0].ImageURL.URL = "https://example.test/mutated.png"
           messages[0].Content.Blocks[0].Source.Data = "bXV0YXRlZA=="
           messages[1].ToolCalls[0].ThoughtSig[0] = 9
          }

          func TestAgentInitialMessagesOwnTheirNestedState(t *testing.T) {
           seed := cloneHistoryFixture()
           ag, err := New(Config{LLM: historyCloneModel{}, InitialMessages: seed})
           if err != nil {
            t.Fatalf("new agent: %v", err)
           }
           mutateHistoryFixture(seed)
           assertHistoryFixtureUnchanged(t, ag.Messages())
          }

          func TestAgentMessagesReturnsIndependentNestedState(t *testing.T) {
           ag, err := New(Config{LLM: historyCloneModel{}, InitialMessages: cloneHistoryFixture()})
           if err != nil {
            t.Fatalf("new agent: %v", err)
           }
           snapshot := ag.Messages()
           mutateHistoryFixture(snapshot)
           assertHistoryFixtureUnchanged(t, ag.Messages())
          }

          func TestAgentReplaceHistoryOwnsNestedState(t *testing.T) {
           ag, err := New(Config{LLM: historyCloneModel{}})
           if err != nil {
            t.Fatalf("new agent: %v", err)
           }
           replacement := cloneHistoryFixture()
           ag.ReplaceHistory(replacement)
           mutateHistoryFixture(replacement)
           assertHistoryFixtureUnchanged(t, ag.Messages())
          }
          EOF

          gofmt -w sdk/llm/clone.go sdk/llm/clone_test.go sdk/agent/agent.go sdk/agent/agent_history_clone_test.go

      - name: Run focused tests
        working-directory: repo
        run: |
          go test ./sdk/llm -run '^TestCloneMessages' -count=1
          go test ./sdk/agent -run '^TestAgent(InitialMessagesOwnTheirNestedState|MessagesReturnsIndependentNestedState|ReplaceHistoryOwnsNestedState)$' -count=1

      - name: Run race-focused tests
        working-directory: repo
        run: go test -race ./sdk/llm ./sdk/agent -run 'Test(CloneMessages|AgentInitialMessagesOwnTheirNestedState|AgentMessagesReturnsIndependentNestedState|AgentReplaceHistoryOwnsNestedState)' -count=1

      - name: Run full test suite
        working-directory: repo
        run: go test ./... -count=1

      - name: Commit validated fix and remove temporary workflow
        working-directory: repo
        run: |
          set -euo pipefail
          rm .github/workflows/issue-10-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): deep-clone history ownership boundaries"
          git push origin HEAD:"$TARGET_BRANCH"
