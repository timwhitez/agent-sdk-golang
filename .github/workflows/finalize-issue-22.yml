name: Finalize issue 22 patch

on:
  push:
    branches: [fix/issue-22-single-active-turn]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-22-single-active-turn
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply reviewed turn-admission fix
        run: |
          set -euo pipefail
          cat > sdk/agent/turn_concurrency.go <<'EOF'
          package agent

          import "errors"

          // ErrAgentBusy reports that a second turn was submitted while this
          // Agent still owns an active turn. An Agent's mutable history,
          // compaction state, steering stage and accounting sequence form one
          // turn-scoped state machine and are not shared concurrently.
          var ErrAgentBusy = errors.New("agent: another query is already in progress")
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdk/agent/agent.go")
          source = path.read_text(encoding="utf-8")

          field_old = '''\tturnCancelMu    sync.Mutex
\tturnCancelByOut map[chan Event]*turnBackpressure
}
'''
          field_new = '''\t// turnActive is acquired synchronously by QueryStreamWithSteering before
\t// its goroutine starts, so overlapping submissions cannot race to append
\t// user input or replace the shared active-stage cancellation slot.
\tturnActive      atomic.Bool
\tturnCancelMu    sync.Mutex
\tturnCancelByOut map[chan Event]*turnBackpressure
}
'''
          if source.count(field_old) != 1:
              raise SystemExit("unexpected Agent turn-cancellation field shape")
          source = source.replace(field_old, field_new, 1)

          start_old = '''\tout := make(chan Event, bufferSize)
\tunregisterTurn := a.registerTurnCancellation(out, ctx)
\tgo func() {
\t\tdefer close(out)
\t\tdefer unregisterTurn()
\t\ta.cleanupToolResultDumps(toolResultDumpNow(), false)
'''
          start_new = '''\tout := make(chan Event, bufferSize)
\tif !a.turnActive.CompareAndSwap(false, true) {
\t\t// Admission is decided synchronously and the channel is buffered, so
\t\t// publish the deterministic busy result before returning. The rejected
\t\t// input never reaches history or any provider/tool stage.
\t\tout <- ErrorEvent{Kind: "agent_busy", Message: ErrAgentBusy.Error()}
\t\tclose(out)
\t\treturn out
\t}
\tunregisterTurn := a.registerTurnCancellation(out, ctx)
\tgo func() {
\t\t// LIFO defer order removes cancellation bookkeeping, releases admission,
\t\t// then closes the stream. Observing closure therefore guarantees that a
\t\t// subsequent turn can be admitted.
\t\tdefer close(out)
\t\tdefer a.turnActive.Store(false)
\t\tdefer unregisterTurn()
\t\ta.cleanupToolResultDumps(toolResultDumpNow(), false)
'''
          if source.count(start_old) != 1:
              raise SystemExit("unexpected QueryStreamWithSteering startup shape")
          source = source.replace(start_old, start_new, 1)
          path.write_text(source, encoding="utf-8")

          docs = Path("agent_docs/architecture.md")
          doc_source = docs.read_text(encoding="utf-8")
          heading = "## Agent Turn Concurrency Contract"
          if heading not in doc_source:
              doc_source = doc_source.rstrip() + '''

## Agent Turn Concurrency Contract

A single `Agent` owns one mutable conversation and permits exactly one active
`QueryStream` / `QueryStreamWithSteering` turn. Admission is acquired before the
turn goroutine starts. An overlapping submission receives an
`ErrorEvent{Kind: "agent_busy"}` and does not append its input, invoke a provider,
or replace active steering/cancellation state. Callers that need parallel turns
must create separate `Agent` instances.
'''
              docs.write_text(doc_source, encoding="utf-8")
          PY

          cat > sdk/agent/agent_turn_concurrency_test.go <<'EOF'
          package agent

          import (
           "context"
           "strings"
           "sync"
           "sync/atomic"
           "testing"
           "time"

           "github.com/timwhitez/agent-sdk-golang/sdk/llm"
          )

          type singleActiveTurnModel struct {
           calls       atomic.Int32
           firstStart  chan struct{}
           firstFinish chan struct{}
           startOnce   sync.Once
          }

          func (m *singleActiveTurnModel) Provider() string { return "stub" }
          func (m *singleActiveTurnModel) Model() string    { return "stub" }
          func (m *singleActiveTurnModel) Invoke(ctx context.Context, _ llm.InvokeRequest) (*llm.Completion, error) {
           call := m.calls.Add(1)
           if call == 1 {
            m.startOnce.Do(func() { close(m.firstStart) })
            select {
            case <-ctx.Done():
             return nil, ctx.Err()
            case <-m.firstFinish:
            }
           }
           return &llm.Completion{Content: llm.TextContent("ok")}, nil
          }

          func collectTurnEvents(t *testing.T, events <-chan Event) []Event {
           t.Helper()
           deadline := time.NewTimer(5 * time.Second)
           defer deadline.Stop()
           var out []Event
           for {
            select {
            case event, ok := <-events:
             if !ok {
              return out
             }
             out = append(out, event)
            case <-deadline.C:
             t.Fatal("timed out waiting for Agent event stream to close")
            }
           }
          }

          func TestAgentRejectsOverlappingTurnWithoutMutatingHistory(t *testing.T) {
           model := &singleActiveTurnModel{
            firstStart:  make(chan struct{}),
            firstFinish: make(chan struct{}),
           }
           ag, err := New(Config{LLM: model})
           if err != nil {
            t.Fatalf("new agent: %v", err)
           }

           first := ag.QueryStream(context.Background(), llm.TextContent("first"))
           select {
           case <-model.firstStart:
           case <-time.After(5 * time.Second):
            t.Fatal("first provider invocation did not start")
           }

           secondEvents := collectTurnEvents(t, ag.QueryStream(context.Background(), llm.TextContent("second")))
           busy := false
           for _, event := range secondEvents {
            if failure, ok := event.(ErrorEvent); ok && failure.Kind == "agent_busy" {
             busy = strings.Contains(failure.Message, ErrAgentBusy.Error())
            }
           }
           if !busy {
            t.Fatalf("second turn events did not contain agent_busy: %#v", secondEvents)
           }
           if got := model.calls.Load(); got != 1 {
            t.Fatalf("provider calls while first turn active = %d, want 1", got)
           }
           for _, message := range ag.Messages() {
            if message.Role == llm.RoleUser && message.PlainText() == "second" {
             t.Fatal("rejected overlapping input was appended to history")
            }
           }

           close(model.firstFinish)
           firstEvents := collectTurnEvents(t, first)
           foundFinal := false
           for _, event := range firstEvents {
            if _, ok := event.(FinalResponseEvent); ok {
             foundFinal = true
            }
           }
           if !foundFinal {
            t.Fatalf("first turn did not complete normally: %#v", firstEvents)
           }

           thirdEvents := collectTurnEvents(t, ag.QueryStream(context.Background(), llm.TextContent("third")))
           for _, event := range thirdEvents {
            if failure, ok := event.(ErrorEvent); ok && failure.Kind == "agent_busy" {
             t.Fatalf("turn admission was not released after completion: %#v", thirdEvents)
            }
           }
           if got := model.calls.Load(); got != 2 {
            t.Fatalf("provider calls after third turn = %d, want 2", got)
           }
          }

          func TestAgentConcurrentSubmissionsAdmitAtMostOneTurn(t *testing.T) {
           model := &singleActiveTurnModel{
            firstStart:  make(chan struct{}),
            firstFinish: make(chan struct{}),
           }
           ag, err := New(Config{LLM: model})
           if err != nil {
            t.Fatalf("new agent: %v", err)
           }

           const callers = 16
           start := make(chan struct{})
           streams := make(chan (<-chan Event), callers)
           var wg sync.WaitGroup
           for i := 0; i < callers; i++ {
            wg.Add(1)
            go func() {
             defer wg.Done()
             <-start
             streams <- ag.QueryStream(context.Background(), llm.TextContent("parallel"))
            }()
           }
           close(start)
           wg.Wait()
           close(streams)

           select {
           case <-model.firstStart:
           case <-time.After(5 * time.Second):
            t.Fatal("admitted provider invocation did not start")
           }

           var active <-chan Event
           busyCount := 0
           for stream := range streams {
            select {
            case event, ok := <-stream:
             if !ok {
              t.Fatal("rejected stream closed without its agent_busy event")
             }
             failure, ok := event.(ErrorEvent)
             if !ok || failure.Kind != "agent_busy" {
              t.Fatalf("unexpected pre-release event: %#v", event)
             }
             busyCount++
             for range stream {
             }
            default:
             if active != nil {
              t.Fatal("more than one concurrent stream remained active")
             }
             active = stream
            }
           }
           if got := model.calls.Load(); got != 1 {
            t.Fatalf("provider calls before release = %d, want 1", got)
           }
           if busyCount != callers-1 {
            t.Fatalf("busy rejections = %d, want %d", busyCount, callers-1)
           }
           if active == nil {
            t.Fatal("no active stream was admitted")
           }
           close(model.firstFinish)
           collectTurnEvents(t, active)
          }
          EOF

          gofmt -w sdk/agent/turn_concurrency.go sdk/agent/agent.go sdk/agent/agent_turn_concurrency_test.go
          git diff --check
      - name: Focused turn-concurrency tests
        run: go test ./sdk/agent -run '^TestAgent(RejectsOverlappingTurnWithoutMutatingHistory|ConcurrentSubmissionsAdmitAtMostOneTurn)$' -count=20
      - name: Race-focused turn-concurrency tests
        run: go test -race ./sdk/agent -run '^TestAgent(RejectsOverlappingTurnWithoutMutatingHistory|ConcurrentSubmissionsAdmitAtMostOneTurn)$' -count=5
      - name: Full repository tests
        run: go test ./... -count=1
      - name: Commit source-only validated fix
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-issue-22.yml \
            .github/workflows/issue-22-patch.yml \
            .github/workflows/issue-22-runner-fix.yml \
            .github/issue-22-trigger.txt \
            .github/issue-22-final-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): reject overlapping turns"
          git push origin HEAD:fix/issue-22-single-active-turn
