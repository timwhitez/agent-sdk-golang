name: Execute issue 22 validated source patch

on:
  push:
    branches: [fix/issue-22-single-active-turn]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply reviewed steps, test, and push source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/issue-22-single-active-turn

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/issue-22-patch.yml').read_text(encoding='utf-8').splitlines()
          names = [
              'Enforce one active turn per Agent',
              'Run focused tests',
              'Run race-focused tests',
              'Run full test suite',
          ]

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              try:
                  index = lines.index(marker) + 1
              except ValueError as exc:
                  raise SystemExit(f'missing reviewed step: {name}') from exc
              while index < len(lines):
                  line = lines[index]
                  if line.startswith('      - name: '):
                      raise SystemExit(f'step {name} has no run command')
                  if line == '        run: |':
                      index += 1
                      body = []
                      while index < len(lines):
                          line = lines[index]
                          if line.startswith('      - name: '):
                              break
                          if line == '':
                              body.append('')
                          elif line.startswith('          '):
                              body.append(line[10:])
                          else:
                              break
                          index += 1
                      if not body:
                          raise SystemExit(f'step {name} has an empty run block')
                      return '\n'.join(body) + '\n'
                  inline = '        run: '
                  if line.startswith(inline):
                      command = line[len(inline):]
                      if not command:
                          raise SystemExit(f'step {name} has an empty inline run command')
                      return command + '\n'
                  index += 1
              raise SystemExit(f'step {name} has no run command')

          for number, name in enumerate(names, start=1):
              Path(f'/tmp/issue-22-step-{number}.sh').write_text(
                  'set -euo pipefail\n' + extract(name), encoding='utf-8'
              )
          PY

          bash /tmp/issue-22-step-1.sh
          python3 - <<'PY'
          from pathlib import Path

          agent_path = Path('sdk/agent/agent.go')
          agent_source = agent_path.read_text(encoding='utf-8')
          old = '''\tif !a.turnActive.CompareAndSwap(false, true) {
\t\tgo func() {
\t\t\tdefer close(out)
\t\t\ta.emitEvent(out, ErrorEvent{Kind: "agent_busy", Message: ErrAgentBusy.Error()})
\t\t}()
\t\treturn out
\t}
\tunregisterTurn := a.registerTurnCancellation(out, ctx)
\tgo func() {
\t\t// Release admission only after cancellation bookkeeping is removed and
\t\t// the previous event stream is closed.
\t\tdefer a.turnActive.Store(false)
\t\tdefer close(out)
\t\tdefer unregisterTurn()
'''
          new = '''\tif !a.turnActive.CompareAndSwap(false, true) {
\t\t// Admission is decided synchronously and the channel is always buffered,
\t\t// so publish the deterministic busy result before returning. This avoids
\t\t// a scheduling race where callers receive a channel before its rejection.
\t\tout <- ErrorEvent{Kind: "agent_busy", Message: ErrAgentBusy.Error()}
\t\tclose(out)
\t\treturn out
\t}
\tunregisterTurn := a.registerTurnCancellation(out, ctx)
\tgo func() {
\t\t// LIFO defer order removes cancellation bookkeeping, releases admission,
\t\t// then closes the stream. Observing stream closure therefore guarantees
\t\t// that a subsequent turn can be admitted.
\t\tdefer close(out)
\t\tdefer a.turnActive.Store(false)
\t\tdefer unregisterTurn()
'''
          if agent_source.count(old) != 1:
              raise SystemExit('unexpected generated turn-admission block')
          agent_path.write_text(agent_source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('sdk/agent/agent_turn_concurrency_test.go')
          test_source = test_path.read_text(encoding='utf-8')
          candidates = [
              'streams := make(chan <-chan Event, callers)',
              'streams := make(chan<- chan Event, callers)',
              'streams := make(chan (<-chan Event), callers)',
          ]
          matches = [candidate for candidate in candidates if test_source.count(candidate) == 1]
          if len(matches) != 1:
              raise SystemExit(f'unexpected concurrent stream channel declaration: matches={matches!r}')
          test_source = test_source.replace(matches[0], 'streams := make(chan (<-chan Event), callers)', 1)
          test_path.write_text(test_source, encoding='utf-8')
          PY
          gofmt -w sdk/agent/agent.go sdk/agent/agent_turn_concurrency_test.go
          bash /tmp/issue-22-step-2.sh
          bash /tmp/issue-22-step-3.sh
          bash /tmp/issue-22-step-4.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/agent/turn_concurrency.go sdk/agent/agent.go sdk/agent/agent_turn_concurrency_test.go agent_docs/architecture.md
          git commit -m "fix(agent): reject overlapping turns"
          git push origin HEAD:fix/issue-22-single-active-turn
