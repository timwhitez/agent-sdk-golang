name: Apply and verify issue 16 fix

on:
  push:
    branches: [fix/issue-16-apply-patch-stale-targets]
  pull_request:
    branches: [fix/issue-18-apply-patch-move-no-clobber]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-16.py
      - run: rm -f .github/fixes/issue-16.py .github/workflows/apply-issue-16.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_patch.go sdk/tools/sandbox/sandbox_patch_stale_target_test.go
      - run: git diff --check
      - name: Targeted stale-target regressions
        run: go test ./sdk/tools/sandbox -run 'TestPatchPlannerRejectsUpdatedFileChangedAfterPlanning|TestPatchPlannerRejectsDeleteTargetReplacedAfterPlanning|TestPatchPlannerRejectsMoveSourceChangedAfterPlanning|TestPatchPlannerMultipleUpdatesDoNotConflictWithOwnWrites|TestPatchPlannerMoveRejectsDestinationCreatedAfterPlanning' -count=1
      - name: Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): reject stale apply_patch targets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
