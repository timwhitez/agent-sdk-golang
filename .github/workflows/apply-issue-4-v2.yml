name: Apply and verify rebased issue 4 fix

on:
  push:
    branches: [fix/issue-4-webfetch-confirm-before-dns-v2]
  pull_request:
    branches: [fix/issue-3-webfetch-dns-pinning]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-4-v2.py
      - run: rm -f .github/fixes/issue-4-v2.py .github/workflows/apply-issue-4-v2.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_webfetch.go sdk/tools/sandbox/sandbox_webfetch_confirmation_test.go sdk/tools/sandbox/sandbox_webfetch_rebinding_test.go
      - run: git diff --check
      - name: Focused confirmation and socket-bound tests
        run: go test ./sdk/tools/sandbox -run 'TestWebfetchDenialPerformsNoDNSOrDial|TestWebfetchBlockedLiteralIsRejectedWithoutPrompt|TestWebfetchRejectsReboundAddressUsedForSocket|TestWebfetchDoesNotInheritCustomDefaultRoundTripper|TestValidatedWebfetchDialUsesLiteralApprovedAddress' -count=20
      - name: Race-focused tests
        run: go test -race ./sdk/tools/sandbox -run 'TestWebfetchDenialPerformsNoDNSOrDial|TestWebfetchBlockedLiteralIsRejectedWithoutPrompt|TestWebfetchRejectsReboundAddressUsedForSocket' -count=10
      - name: Complete Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Full repository tests
        run: go test ./... -count=1
      - name: Commit verified source-only fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): defer WebFetch DNS until confirmation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
