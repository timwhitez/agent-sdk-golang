name: Apply issue 24 fix

on:
  push:
    branches:
      - fix/issue-24-anthropic-redirect
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"

      - name: Add credential-safe redirect policy
        working-directory: repo
        run: |
          set -euo pipefail
          cat > sdk/llm/anthropic/redirect.go <<'EOF'
          package anthropic

          import (
           "fmt"
           "net/http"
           "net/url"
           "strings"
          )

          const anthropicMaxRedirects = 10

          type anthropicOrigin struct {
           scheme string
           host   string
           port   string
          }

          func originForAnthropicURL(value *url.URL) (anthropicOrigin, error) {
           if value == nil {
            return anthropicOrigin{}, fmt.Errorf("anthropic: redirect URL is missing")
           }
           scheme := strings.ToLower(strings.TrimSpace(value.Scheme))
           host := strings.ToLower(strings.TrimSpace(value.Hostname()))
           if scheme == "" || host == "" {
            return anthropicOrigin{}, fmt.Errorf("anthropic: redirect URL has no origin")
           }
           port := strings.TrimSpace(value.Port())
           if port == "" {
            switch scheme {
            case "http":
             port = "80"
            case "https":
             port = "443"
            }
           }
           return anthropicOrigin{scheme: scheme, host: host, port: port}, nil
          }

          func validateAnthropicRedirectTarget(origin anthropicOrigin, target *url.URL) error {
           destination, err := originForAnthropicURL(target)
           if err != nil {
            return err
           }
           if origin.scheme == "https" && destination.scheme != "https" {
            return fmt.Errorf("anthropic: refusing HTTPS redirect downgrade to %s", target.Redacted())
           }
           if origin != destination {
            return fmt.Errorf("anthropic: refusing cross-origin redirect to %s", target.Redacted())
           }
           return nil
          }

          // redirectSafeHTTPClient clones base and installs a mandatory policy
          // before any redirected request is sent. The original client is never
          // mutated. Allowed same-origin redirects still invoke the caller's
          // callback, after which the target is checked again in case the
          // callback changed req.URL.
          func redirectSafeHTTPClient(base *http.Client) *http.Client {
           if base == nil {
            base = &http.Client{}
           }
           cloned := *base
           callerCheck := base.CheckRedirect
           cloned.CheckRedirect = func(req *http.Request, via []*http.Request) error {
            if len(via) == 0 || via[0] == nil || via[0].URL == nil {
             return fmt.Errorf("anthropic: redirect is missing its origin request")
            }
            if len(via) >= anthropicMaxRedirects {
             return fmt.Errorf("anthropic: stopped after %d redirects", anthropicMaxRedirects)
            }
            origin, err := originForAnthropicURL(via[0].URL)
            if err != nil {
             return err
            }
            if req == nil {
             return fmt.Errorf("anthropic: redirect request is missing")
            }
            if err := validateAnthropicRedirectTarget(origin, req.URL); err != nil {
             return err
            }
            if callerCheck != nil {
             if err := callerCheck(req, via); err != nil {
              return err
             }
             if err := validateAnthropicRedirectTarget(origin, req.URL); err != nil {
              return err
             }
            }
            return nil
           }
           return &cloned
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdk/llm/anthropic/client.go")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "\tclient := c.httpClient()\n",
                  "\tclient := redirectSafeHTTPClient(c.httpClient())\n",
                  "buffered client",
              ),
              (
                  "\t\tclient := streamHTTPClient(c.httpClient())\n",
                  "\t\tclient := streamHTTPClient(redirectSafeHTTPClient(c.httpClient()))\n",
                  "streaming client",
              ),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected client.go shape for {label}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          docs = Path("agent_docs/providers.md")
          doc_source = docs.read_text(encoding="utf-8")
          heading = "### Anthropic redirect credential boundary"
          if heading in doc_source:
              raise SystemExit("Anthropic redirect section already exists")
          doc_source = doc_source.rstrip() + '''\n\n### Anthropic redirect credential boundary\n\nAnthropic buffered and streaming clients follow only same-origin redirects.\nCross-origin targets and HTTPS-to-non-HTTPS downgrades are rejected before a\nredirected request is sent, so `x-api-key` and request content never leave the\nconfigured API origin. A caller-provided `CheckRedirect` callback is composed\nfor allowed same-origin redirects and cannot mutate the request onto another\norigin without a second policy check.\n'''
          docs.write_text(doc_source, encoding="utf-8")
          PY

          cat > sdk/llm/anthropic/redirect_test.go <<'EOF'
          package anthropic

          import (
           "context"
           "errors"
           "io"
           "net/http"
           "net/http/httptest"
           "net/url"
           "strings"
           "sync/atomic"
           "testing"
           "time"

           "github.com/timwhitez/agent-sdk-golang/sdk/llm"
          )

          func redirectTestRequest() llm.InvokeRequest {
           return llm.InvokeRequest{Messages: []llm.Message{llm.NewUserMessage("ping")}}
          }

          func TestAnthropicInvokeRejectsCrossOriginRedirectWithoutLeakingAPIKey(t *testing.T) {
           var destinationCalls atomic.Int32
           leaked := make(chan string, 1)
           destination := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            destinationCalls.Add(1)
            leaked <- r.Header.Get("X-Api-Key")
            w.WriteHeader(http.StatusInternalServerError)
           }))
           defer destination.Close()

           redirector := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            http.Redirect(w, r, destination.URL, http.StatusTemporaryRedirect)
           }))
           defer redirector.Close()

           client := &Client{
            HTTPClient: &http.Client{Timeout: 2 * time.Second},
            BaseURL:    redirector.URL,
            APIKey:     "secret-key",
            ModelName:  "test-model",
            MaxTokens:  16,
            MaxRetries: 1,
           }
           if _, err := client.Invoke(context.Background(), redirectTestRequest()); err == nil || !strings.Contains(err.Error(), "cross-origin redirect") {
            t.Fatalf("Invoke error = %v, want cross-origin redirect rejection", err)
           }
           if got := destinationCalls.Load(); got != 0 {
            t.Fatalf("redirect destination received %d request(s)", got)
           }
           select {
           case value := <-leaked:
            t.Fatalf("redirect destination received x-api-key %q", value)
           default:
           }
          }

          func TestAnthropicInvokeStreamRejectsCrossOriginRedirectWithoutLeakingAPIKey(t *testing.T) {
           var destinationCalls atomic.Int32
           destination := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            destinationCalls.Add(1)
            w.WriteHeader(http.StatusInternalServerError)
           }))
           defer destination.Close()

           redirector := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            http.Redirect(w, r, destination.URL, http.StatusTemporaryRedirect)
           }))
           defer redirector.Close()

           client := &Client{
            HTTPClient: &http.Client{Timeout: 2 * time.Second},
            BaseURL:    redirector.URL,
            APIKey:     "secret-key",
            ModelName:  "test-model",
            MaxTokens:  16,
            MaxRetries: 1,
           }
           events, err := client.InvokeStream(context.Background(), redirectTestRequest())
           if err != nil {
            t.Fatalf("InvokeStream setup: %v", err)
           }
           found := false
           for event := range events {
            if failure, ok := event.(llm.StreamErrorEvent); ok && failure.Err != nil && strings.Contains(failure.Err.Error(), "cross-origin redirect") {
             found = true
            }
           }
           if !found {
            t.Fatal("stream did not emit cross-origin redirect error")
           }
           if got := destinationCalls.Load(); got != 0 {
            t.Fatalf("stream redirect destination received %d request(s)", got)
           }
          }

          func TestAnthropicInvokeAllowsSameOriginRedirect(t *testing.T) {
           var server *httptest.Server
           server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            if r.URL.Path != "/redirected" {
             http.Redirect(w, r, server.URL+"/redirected", http.StatusTemporaryRedirect)
             return
            }
            if got := r.Header.Get("X-Api-Key"); got != "secret-key" {
             t.Fatalf("same-origin x-api-key = %q", got)
            }
            w.Header().Set("Content-Type", "application/json")
            _, _ = io.WriteString(w, `{"id":"msg_1","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"test-model","stop_reason":"end_turn","usage":{"input_tokens":1,"output_tokens":1}}`)
           }))
           defer server.Close()

           client := &Client{
            HTTPClient: &http.Client{Timeout: 2 * time.Second},
            BaseURL:    server.URL,
            APIKey:     "secret-key",
            ModelName:  "test-model",
            MaxTokens:  16,
            MaxRetries: 1,
           }
           completion, err := client.Invoke(context.Background(), redirectTestRequest())
           if err != nil {
            t.Fatalf("Invoke: %v", err)
           }
           if got := completion.PlainText(); got != "ok" {
            t.Fatalf("completion text = %q, want ok", got)
           }
          }

          func TestRedirectSafeHTTPClientComposesAndRechecksCallerCallback(t *testing.T) {
           origin, _ := url.Parse("https://api.example.test/v1/messages")
           sameOrigin, _ := url.Parse("https://api.example.test/v2/messages")
           foreign, _ := url.Parse("https://attacker.example.test/steal")

           called := false
           base := &http.Client{CheckRedirect: func(req *http.Request, _ []*http.Request) error {
            called = true
            req.URL = foreign
            return nil
           }}
           safe := redirectSafeHTTPClient(base)
           request := &http.Request{URL: sameOrigin}
           err := safe.CheckRedirect(request, []*http.Request{{URL: origin}})
           if !called {
            t.Fatal("caller CheckRedirect was not invoked for same-origin target")
           }
           if err == nil || !strings.Contains(err.Error(), "cross-origin redirect") {
            t.Fatalf("post-callback error = %v, want cross-origin rejection", err)
           }
           if base.CheckRedirect == nil {
            t.Fatal("base client was mutated")
           }
          }

          func TestRedirectSafeHTTPClientRejectsHTTPSDowngrade(t *testing.T) {
           origin, _ := url.Parse("https://api.example.test/v1/messages")
           downgrade, _ := url.Parse("http://api.example.test/v1/messages")
           safe := redirectSafeHTTPClient(&http.Client{})
           err := safe.CheckRedirect(&http.Request{URL: downgrade}, []*http.Request{{URL: origin}})
           if err == nil || !strings.Contains(err.Error(), "HTTPS redirect downgrade") {
            t.Fatalf("downgrade error = %v", err)
           }
          }

          func TestRedirectSafeHTTPClientPreservesCallerStopDecision(t *testing.T) {
           origin, _ := url.Parse("https://api.example.test/v1/messages")
           target, _ := url.Parse("https://api.example.test/v2/messages")
           safe := redirectSafeHTTPClient(&http.Client{CheckRedirect: func(*http.Request, []*http.Request) error {
            return http.ErrUseLastResponse
           }})
           err := safe.CheckRedirect(&http.Request{URL: target}, []*http.Request{{URL: origin}})
           if !errors.Is(err, http.ErrUseLastResponse) {
            t.Fatalf("caller redirect decision = %v, want ErrUseLastResponse", err)
           }
          }
          EOF

          gofmt -w sdk/llm/anthropic/redirect.go sdk/llm/anthropic/client.go sdk/llm/anthropic/redirect_test.go

      - name: Run focused tests
        working-directory: repo
        run: go test ./sdk/llm/anthropic -run '^(TestAnthropicInvoke.*Redirect|TestRedirectSafeHTTPClient.*)$' -count=20

      - name: Run race-focused tests
        working-directory: repo
        run: go test -race ./sdk/llm/anthropic -run '^(TestAnthropicInvoke.*Redirect|TestRedirectSafeHTTPClient.*)$' -count=5

      - name: Run full test suite
        working-directory: repo
        run: go test ./... -count=1

      - name: Commit validated fix and remove temporary workflow
        working-directory: repo
        run: |
          set -euo pipefail
          rm .github/workflows/issue-24-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(anthropic): block credential-bearing cross-origin redirects"
          git push origin HEAD:"$TARGET_BRANCH"
