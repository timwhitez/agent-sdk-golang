name: Repair issue 24 validation runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repair workflow and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/issue-24-anthropic-redirect
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue-24-patch.yml')
          source = path.read_text(encoding='utf-8')
          old = 'git push origin HEAD:"$TARGET_BRANCH"'
          new = 'git push origin HEAD:"fix/issue-24-anthropic-redirect"'
          if source.count(old) != 1:
              raise SystemExit('unexpected issue-24 push command shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue-24-runner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair issue 24 validation push step"
          git push origin HEAD:fix/issue-24-anthropic-redirect
