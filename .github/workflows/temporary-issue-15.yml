name: Temporary verification for issue 15

on:
  push:
    branches: [fix/issue-15-openai-tool-history-ids]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l sdk/llm/openai/tool_history.go sdk/llm/openai/tool_history_test.go)"
      - name: Targeted tests
        run: go test ./sdk/llm/openai -count=1
      - name: Full test suite
        run: go test ./... -count=1
