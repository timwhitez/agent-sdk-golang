name: Re-review issue 13 callback lock boundaries

on:
  push:
    branches: [fix/issue-13-compaction-callback-lock]
  pull_request:
    branches: [fix/issue-10-deep-clone-history]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-13-review.py
      - run: rm -f .github/fixes/issue-13-review.py .github/workflows/review-issue-13-callbacks.yml
      - run: gofmt -w sdk/agent/agent.go sdk/agent/agent_compaction_callback_lock_test.go
      - run: git diff --check
      - name: Focused callback re-entry tests
        run: go test ./sdk/agent -run 'TestApplyPendingCompaction(WriterCanReadMessages|WarningCallbackCanReadMessages|TokenEstimatorCanReadMessages)|TestBlockedCheckpointWriterDoesNotBlockHistoryReads' -count=20
      - name: Race-focused callback tests
        run: go test -race ./sdk/agent -run 'TestApplyPendingCompaction(WriterCanReadMessages|WarningCallbackCanReadMessages|TokenEstimatorCanReadMessages)|TestBlockedCheckpointWriterDoesNotBlockHistoryReads' -count=10
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit second-pass verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): keep compaction callbacks outside history lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
