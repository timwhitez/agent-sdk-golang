name: Re-review issue 3 transport hardening

on:
  push:
    branches: [fix/issue-3-webfetch-dns-pinning]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-3-security-review.py
      - run: rm -f .github/fixes/issue-3-security-review.py .github/workflows/review-issue-3-security.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_webfetch.go sdk/tools/sandbox/sandbox_test.go sdk/tools/sandbox/sandbox_webfetch_transport_policy_test.go
      - run: git diff --check
      - name: Focused transport-policy tests
        run: go test ./sdk/tools/sandbox -run 'TestWebfetchRejectsReboundAddressUsedForSocket|TestWebfetchDoesNotInheritCustomDefaultRoundTripper|TestValidatedWebfetchDialUsesLiteralApprovedAddress|TestWebfetchToolTruncationNotice|TestWebfetchToolReadErrorIsSurfaced|TestWebfetchToolBlocksRedirectToPrivateDestination' -count=1
      - name: Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Race-focused tests
        run: go test -race ./sdk/tools/sandbox -run 'TestWebfetchRejectsReboundAddressUsedForSocket|TestWebfetchDoesNotInheritCustomDefaultRoundTripper|TestValidatedWebfetchDialUsesLiteralApprovedAddress' -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit second-pass verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): remove WebFetch transport policy bypass"
          git push origin "HEAD:${GITHUB_REF_NAME}"
