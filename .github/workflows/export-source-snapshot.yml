name: export-source-snapshot

on:
  push:
    branches:
      - ops/local-audit-snapshot

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Package source
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=agent-sdk-golang-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sdk-golang-source-${{ github.sha }}
          path: agent-sdk-golang-source.tar.gz
          if-no-files-found: error
