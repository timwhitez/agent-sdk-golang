name: Apply and verify issue 18 fix

on:
  push:
    branches: [fix/issue-18-apply-patch-move-no-clobber]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-18.py
      - run: rm -f .github/fixes/issue-18.py .github/workflows/apply-issue-18.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_patch.go sdk/tools/sandbox/sandbox_patch_move_conflict_test.go
      - run: git diff --check
      - name: Targeted tests
        run: go test ./sdk/tools/sandbox -run 'TestApplyPatchMoveRejectsExistingDestination|TestPatchPlannerMoveRejectsDestinationCreatedAfterPlanning' -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): reject apply_patch move conflicts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
