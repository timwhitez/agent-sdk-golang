name: Apply and verify issue 7 fix

on:
  push:
    branches: [fix/issue-7-openai-truncated-sse]
  pull_request:
    branches: [fix/issue-6-openai-stream-cancel]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-7.py
      - run: rm -f .github/fixes/issue-7.py .github/workflows/apply-issue-7.yml
      - run: gofmt -w sdk/llm/openai/chat.go sdk/llm/openai/responses.go sdk/llm/openai/truncated_sse_test.go
      - run: git diff --check
      - name: Targeted truncated-SSE tests
        run: go test ./sdk/llm/openai -run 'TestChatStreamEOFBeforeDoneIsIncomplete|TestChatPartialToolArgumentsEOFIsIncomplete|TestResponsesStreamEOFBeforeCompletedIsIncomplete|TestExplicitOpenAITerminalsStillComplete' -count=1
      - name: OpenAI provider tests
        run: go test ./sdk/llm/openai -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(openai): reject truncated SSE as incomplete"
          git push origin "HEAD:${GITHUB_REF_NAME}"
