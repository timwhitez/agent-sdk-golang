name: Verify issue 12 fix

on:
  push:
    branches: [fix/issue-12-checkpoint-snapshot]
  pull_request:
    branches: [fix/issue-10-deep-clone-history]

permissions:
  contents: write

jobs:
  test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -w sdk/agent/compaction/runtime_checkpoint.go sdk/agent/compaction/runtime_checkpoint_snapshot_test.go
      - run: git diff --check
      - name: Targeted tests
        run: go test ./sdk/agent/compaction -run TestNewCompactionCheckpointOwnsDeepMessageSnapshot -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Remove temporary workflow and commit formatted fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/verify-issue-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(compaction): verify checkpoint snapshot isolation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
