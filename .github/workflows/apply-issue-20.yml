name: Apply and verify issue 20 fix

on:
  push:
    branches: [fix/issue-20-bounded-tool-counts]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-20.py
      - run: rm -f .github/fixes/issue-20.py .github/workflows/apply-issue-20.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_read.go sdk/tools/sandbox/sandbox_grep.go sdk/tools/sandbox/sandbox_numeric_limits_test.go
      - run: git diff --check
      - name: Targeted numeric-bound tests
        run: go test ./sdk/tools/sandbox -run 'TestReadNumericLimitsRejectBeforeAllocation|TestGrepNumericLimitsRejectBeforeAllocation' -count=1
      - name: Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): bound model-controlled read and grep counts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
