name: Re-review issue 18 atomic no-clobber fix

on:
  push:
    branches: [fix/issue-18-apply-patch-move-no-clobber]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-18-atomic.py
      - run: rm -f .github/fixes/issue-18-atomic.py .github/workflows/review-issue-18-atomic.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_patch.go sdk/tools/sandbox/sandbox_patch_move_conflict_test.go
      - run: git diff --check
      - name: Targeted move conflict tests
        run: go test ./sdk/tools/sandbox -run 'TestApplyPatchMoveRejectsExistingDestination|TestPatchPlannerMoveRejectsDestinationCreatedAfterPlanning|TestPatchPlannerMoveRejectsDestinationCreatedAfterFinalCheck' -count=1
      - name: Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit second-pass verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): make patch moves atomically non-clobbering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
