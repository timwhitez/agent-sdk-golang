name: Apply issue 23 fix

on:
  push:
    branches:
      - fix/issue-23-duplicate-tool-names
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"

      - name: Reject duplicate exact tool names
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdk/agent/agent.go")
          source = path.read_text(encoding="utf-8")
          old = '''\ttoolMap := map[string]tools.Tool{}\n\tfor _, t := range cfg.Tools {\n\t\tif t.Name == "" {\n\t\t\treturn nil, fmt.Errorf("agent: tool missing name")\n\t\t}\n\t\ttoolMap[t.Name] = t\n\t}\n'''
          new = '''\ttoolMap := map[string]tools.Tool{}\n\ttoolPositions := map[string]int{}\n\tfor i, t := range cfg.Tools {\n\t\tif t.Name == "" {\n\t\t\treturn nil, fmt.Errorf("agent: tool missing name")\n\t\t}\n\t\tif previous, exists := toolPositions[t.Name]; exists {\n\t\t\treturn nil, fmt.Errorf("agent: duplicate tool name %q at positions %d and %d", t.Name, previous+1, i+1)\n\t\t}\n\t\ttoolPositions[t.Name] = i\n\t\ttoolMap[t.Name] = t\n\t}\n'''
          if source.count(old) != 1:
              raise SystemExit("unexpected agent.New tool registration shape")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          cat > sdk/agent/agent_duplicate_tool_test.go <<'EOF'
          package agent

          import (
           "context"
           "strings"
           "sync/atomic"
           "testing"

           "github.com/timwhitez/agent-sdk-golang/sdk/llm"
           "github.com/timwhitez/agent-sdk-golang/sdk/tools"
          )

          type duplicateToolModel struct {
           calls atomic.Int32
          }

          func (m *duplicateToolModel) Provider() string { return "stub" }
          func (m *duplicateToolModel) Model() string    { return "stub" }
          func (m *duplicateToolModel) Invoke(context.Context, llm.InvokeRequest) (*llm.Completion, error) {
           m.calls.Add(1)
           return &llm.Completion{Content: llm.TextContent("unexpected")}, nil
          }

          func TestAgentNewRejectsDuplicateExactToolNames(t *testing.T) {
           t.Parallel()

           model := &duplicateToolModel{}
           _, err := New(Config{
            LLM: model,
            Tools: []tools.Tool{
             {Name: "lookup", Description: "query lookup"},
             {Name: "lookup", Description: "id lookup"},
            },
           })
           if err == nil {
            t.Fatal("expected duplicate tool name to be rejected")
           }
           message := err.Error()
           for _, want := range []string{`duplicate tool name "lookup"`, "positions 1 and 2"} {
            if !strings.Contains(message, want) {
             t.Fatalf("error %q does not contain %q", message, want)
            }
           }
           if got := model.calls.Load(); got != 0 {
            t.Fatalf("provider invoked %d time(s) after constructor rejection", got)
           }
          }
          EOF

          gofmt -w sdk/agent/agent.go sdk/agent/agent_duplicate_tool_test.go

      - name: Run focused test
        working-directory: repo
        run: go test ./sdk/agent -run '^TestAgentNewRejectsDuplicateExactToolNames$' -count=1

      - name: Run full test suite
        working-directory: repo
        run: go test ./... -count=1

      - name: Commit validated source fix
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/agent/agent.go sdk/agent/agent_duplicate_tool_test.go
          git commit -m "fix(agent): reject duplicate exact tool names"
          git push origin HEAD:fix/issue-23-duplicate-tool-names
