name: Apply and verify issue 3 fix

on:
  push:
    branches: [fix/issue-3-webfetch-dns-pinning]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-3.py
      - run: rm -f .github/fixes/issue-3.py .github/workflows/apply-issue-3.yml
      - run: gofmt -w sdk/tools/sandbox/sandbox_webfetch.go sdk/tools/sandbox/sandbox_webfetch_rebinding_test.go
      - run: git diff --check
      - name: Targeted DNS-rebinding regression
        run: go test ./sdk/tools/sandbox -run TestWebfetchRejectsReboundAddressUsedForSocket -count=1
      - name: Sandbox tests
        run: go test ./sdk/tools/sandbox -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Race-focused regression
        run: go test -race ./sdk/tools/sandbox -run TestWebfetchRejectsReboundAddressUsedForSocket -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): pin webfetch sockets to validated DNS results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
