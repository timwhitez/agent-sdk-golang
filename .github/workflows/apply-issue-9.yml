name: Apply and verify issue 9 fix

on:
  push:
    branches: [fix/issue-9-auth-retry]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-9.py
      - run: python3 .github/fixes/issue-9-contract-tests.py
      - run: rm -f .github/fixes/issue-9.py .github/fixes/issue-9-contract-tests.py .github/workflows/apply-issue-9.yml
      - run: gofmt -w sdk/llm/openai/chat.go sdk/llm/openai/chat_test.go sdk/agent/agent.go sdk/agent/agent_retry_loop_guard_test.go sdk/llm/openai/auth_retry_test.go sdk/agent/agent_auth_retry_test.go
      - run: git diff --check
      - name: Direct-provider request-count tests
        run: go test ./sdk/llm/openai -run 'TestOpenAIAuthFailuresAreNotRetriedByDefault|TestOpenAIAuthRetryCanBeExplicitlyEnabled|TestOpenAIDefaultRetryableStatus' -count=20
      - name: Agent integration and textual classifier tests
        run: go test ./sdk/agent -run 'TestAgentDoesNotRetryOpenAIAuthFailures|TestInvokeRetryRetriesTextualRateLimitAndServerErrors|TestInvokeRetrySkipsTextualNonRetryableProviderErrors' -count=20
      - name: Full test suite, first pass
        run: go test ./... -count=1
      - name: Full test suite, second pass
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(retry): fail fast on authentication errors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
