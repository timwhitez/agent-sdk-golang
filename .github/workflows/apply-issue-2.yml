name: Apply and verify issue 2 fix

on:
  push:
    branches: [fix/issue-2-incomplete-canonical-streams]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-2.py
      - run: rm -f .github/fixes/issue-2.py .github/workflows/apply-issue-2.yml
      - run: gofmt -w sdk/tools/execrunner/runner.go sdk/tools/execrunner/canonical_stream.go sdk/tools/execrunner/runner_incomplete_stream_unix_test.go
      - run: git diff --check
      - name: Targeted escaped-stream regression
        run: go test ./sdk/tools/execrunner -run TestRunDoesNotCommitCanonicalStreamsBeforeEOF -count=1
      - name: Execrunner tests
        run: go test ./sdk/tools/execrunner -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(execrunner): abort canonical streams before EOF"
          git push origin "HEAD:${GITHUB_REF_NAME}"
