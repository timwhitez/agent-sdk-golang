name: Final verification for issue 22

on:
  push:
    branches: [fix/issue-22-single-active-turn]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 .github/fixes/issue-22-final.py
      - name: Remove competing temporary automation
        run: rm -f .github/fixes/issue-22-final.py .github/workflows/issue-22-patch.yml .github/workflows/issue-22-runner-fix.yml .github/workflows/issue-22-final.yml
      - run: gofmt -w sdk/agent/turn_concurrency.go sdk/agent/agent.go sdk/agent/agent_turn_concurrency_test.go
      - run: git diff --check
      - name: Focused overlap tests
        run: go test ./sdk/agent -run '^TestAgent(RejectsOverlappingTurnWithoutMutatingHistory|ConcurrentSubmissionsAdmitAtMostOneTurn)$' -count=20
      - name: Race-focused overlap tests
        run: go test -race ./sdk/agent -run '^TestAgent(RejectsOverlappingTurnWithoutMutatingHistory|ConcurrentSubmissionsAdmitAtMostOneTurn)$' -count=10
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified source-only fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): reject overlapping turns"
          git push origin "HEAD:${GITHUB_REF_NAME}"
