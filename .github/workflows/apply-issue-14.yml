name: Apply and verify issue 14 fix

on:
  push:
    branches: [fix/issue-14-anthropic-tool-id-collisions]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Apply guarded transformation
        run: python3 .github/fixes/issue-14.py
      - name: Remove temporary automation
        run: rm -f .github/fixes/issue-14.py .github/workflows/apply-issue-14.yml
      - name: Format
        run: gofmt -w sdk/llm/anthropic/client.go sdk/llm/anthropic/tool_history_collision_test.go
      - name: Check patch hygiene
        run: git diff --check
      - name: Targeted tests
        run: go test ./sdk/llm/anthropic -count=1
      - name: Full test suite
        run: go test ./... -count=1
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(anthropic): reject colliding tool-call identities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
